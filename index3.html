<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<meta name="description" content="Bull Put Credit Spread Pro - Análisis institucional, decisión SI/NO operar, gestión de riesgo y orden lista para broker.">
<title>Bull Put Credit Spread Pro · 1-7DTE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%88%3C/text%3E%3C/svg%3E">
<style>
/* ================= TOKENS ================= */
:root{
  --bg-primary:#0a0e1a;
  --bg-card:#131829;
  --bg-elevated:#1a2138;
  --bg-hover:#222a45;
  --border:#2a3252;
  --border-light:#3a4570;
  --text-primary:#e8ecf4;
  --text-secondary:#9aa3b8;
  --text-muted:#6b7390;
  --accent-gold:#d4a017;
  --accent-blue:#3b82f6;
  --accent-purple:#8b5cf6;
  --success:#10b981;
  --success-bg:rgba(16,185,129,.12);
  --warning:#f59e0b;
  --warning-bg:rgba(245,158,11,.12);
  --danger:#ef4444;
  --danger-bg:rgba(239,68,68,.12);
  --info:#06b6d4;
  --font-display:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',system-ui,sans-serif;
  --font-mono:'SF Mono','JetBrains Mono','Menlo','Consolas',monospace;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 4px 12px rgba(0,0,0,.3);
  --shadow-lg:0 12px 32px rgba(0,0,0,.4);
  --shadow-glow:0 0 24px rgba(212,160,23,.35);
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-xl:20px;
}

/* ================= BASE ================= */
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  background:var(--bg-primary);
  color:var(--text-primary);
  font-family:var(--font-display);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-primary);padding:8px 12px;border-radius:var(--r-sm);font-size:14px}
input:focus,select:focus{outline:none;border-color:var(--accent-gold)}
.mono{font-family:var(--font-mono)}
.muted{color:var(--text-muted)}
.small{font-size:12px}
.tiny{font-size:11px}
.up{color:var(--success)} .down{color:var(--danger)} .warn{color:var(--warning)}
hr{border:none;border-top:1px solid var(--border);margin:14px 0}

/* ================= HEADER ================= */
header{
  position:sticky;top:0;z-index:90;
  background:rgba(10,14,26,.95);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:10px 16px;
}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1900px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.logo .badge{background:linear-gradient(135deg,var(--accent-gold),#f5c842);color:#0a0e1a;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:800}
.status-pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:4px 9px;border-radius:99px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:5px;background:var(--bg-elevated);border:1px solid var(--border)}
.pill.live{color:var(--success)} .pill.cached{color:var(--warning)} .pill.manual{color:var(--danger)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.header-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--bg-elevated);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s}
.icon-btn:hover{background:var(--bg-hover);transform:translateY(-1px)}

/* ================= LAYOUT ================= */
.container{max-width:1900px;margin:0 auto;padding:14px 16px 80px}
.grid{display:grid;gap:14px;grid-template-columns:1fr}

.col{display:flex;flex-direction:column;gap:14px}

/* ================= CARDS ================= */
.card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  padding:14px;
  box-shadow:var(--shadow-sm);
  transition:border-color .2s;
}
.card:hover{border-color:var(--border-light)}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.card-h h3{font-size:13px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px}
.card-h .right{font-size:12px;color:var(--text-muted)}

/* ================= TABLE ================= */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
td.mono{font-family:var(--font-mono)}
.t-right{text-align:right}

/* ================= STATS BOX ================= */
.stat-box{background:var(--bg-elevated);padding:8px;border-radius:var(--r-sm);text-align:center}
.stat-box .lbl{font-size:10px;color:var(--text-muted);text-transform:uppercase}
.stat-box .val{font-size:16px;font-weight:700;font-family:var(--font-mono);margin-top:2px}

/* ================= MOBILE OPT ================= */
@media(max-width:767px){
  .hero{padding:18px}
  .container{padding:10px 10px 80px}
  .card{padding:12px}
  .icon-btn{width:36px;height:36px}
}

/* Loading animation */
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
.loading{
  background:linear-gradient(90deg,var(--bg-elevated) 25%,var(--bg-hover) 50%,var(--bg-elevated) 75%);
  background-size:200px 100%;
  animation:shimmer 1.5s infinite;
  height:20px;
}
</style>
</head>
<body>

<!-- ============================ HEADER ============================ -->
<header>
  <div class="header-inner">
    <div class="logo">
      📈 Bull Put Pro
      <span class="badge">v1.0</span>
    </div>
    <div class="status-pills" id="statusPills">
      <span class="pill cached" id="dataStatus"><span class="dot"></span>Cargando…</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btnRefresh" title="Refrescar datos">🔄</button>
    </div>
  </div>
</header>

<!-- ============================ MAIN ============================ -->
<div class="container">

  <!-- NIVELES INSTITUCIONALES -->
  <div class="card">
    <div class="card-h"><h3>🏛 Niveles institucionales</h3><div class="right small muted" id="oiStatus">—</div></div>
    <div class="small muted" style="margin-bottom:8px">Top 5 strikes PUT con mayor Open Interest (soportes institucionales). Si tu short put coincide con un muro = pinning te favorece.</div>
    <table id="oiTable">
      <thead><tr><th>Strike</th><th>OI</th><th>Δ vs spot</th><th>Notas</th></tr></thead>
      <tbody id="oiTableBody">
        <tr class="loading"><td colspan="4"></td></tr>
      </tbody>
    </table>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
      <div class="stat-box"><div class="lbl">Max Pain</div><div class="val mono" id="maxPain">—</div></div>
      <div class="stat-box"><div class="lbl">GEX (Mn $/pt)</div><div class="val mono" id="gexVal">—</div></div>
    </div>
  </div>

</div>

<!-- ============================ JS ============================ -->
<script>
// ========================== CONSTANTES ==========================

const UNDERLYINGS = {
  SPY:  { yahoo:'SPY' },
  XSP:  { yahoo:'^XSP' },
  SPX:  { yahoo:'^SPX' },
  QQQ:  { yahoo:'QQQ' },
  IWM:  { yahoo:'IWM' },
  NVDA: { yahoo:'NVDA' },
  TSLA: { yahoo:'TSLA' }
};

const CORS_PROXIES = [
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url => `https://cors.eu.org/${url}`,
  url => `https://corsproxy.io/?${encodeURIComponent(url)}`
];

// ========================== STATE ==========================

let state = {
  selectedUnderlying: 'XSP',
  marketData: {}
};

// ========================== UTILS ==========================

const $ = id => document.getElementById(id);
const fmt = (n, d=2) => isFinite(n) ? n.toLocaleString('en-US',{minimumFractionDigits:d, maximumFractionDigits:d}) : '—';

// ========================== FETCH WITH CORS RETRY ==========================

async function fetchWithRetry(url, maxRetries = 3) {
  for (let i = 0; i < CORS_PROXIES.length; i++) {
    try {
      const proxiedUrl = CORS_PROXIES[i](url);
      const response = await fetch(proxiedUrl, {
        method: 'GET',
        headers: {
          'Accept': 'application/json',
          'User-Agent': 'Mozilla/5.0'
        }
      });
      
      if (!response.ok) {
        console.warn(`Proxy ${i} failed with status ${response.status}`);
        continue;
      }
      
      return await response.json();
    } catch (error) {
      console.warn(`Proxy ${i} failed:`, error.message);
      continue;
    }
  }
  
  throw new Error('All CORS proxies failed');
}

// ========================== FETCH YAHOO DATA ==========================

async function fetchYahooFinanceData(symbol) {
  try {
    const url = `https://query1.finance.yahoo.com/v10/finance/quoteSummary/${symbol}?modules=optionChain,price`;
    
    const data = await fetchWithRetry(url);
    
    if (data.quoteSummary?.result?.[0]?.optionChain?.result?.[0]) {
      return data.quoteSummary.result[0].optionChain.result[0];
    }
    
    console.error('Invalid response structure:', data);
    throw new Error('No option chain data in response');
  } catch (error) {
    console.error('Error fetching Yahoo Finance data:', error);
    return null;
  }
}

// ========================== PROCESS OI DATA ==========================

function processOpenInterestData(optionData) {
  if (!optionData?.puts || optionData.puts.length === 0) {
    return { topStrikes: [], spot: null, maxPain: null };
  }

  const spot = optionData.quote?.regularMarketPrice || 0;
  
  // Extract PUT options with OI
  const puts = optionData.puts
    .filter(p => p.openInterest && p.openInterest > 0 && p.strike)
    .map(p => ({
      strike: parseFloat(p.strike),
      oi: parseInt(p.openInterest),
      delta: p.delta || 0,
      lastPrice: p.lastPrice || 0,
      bid: p.bid || 0,
      ask: p.ask || 0
    }))
    .sort((a, b) => b.oi - a.oi)
    .slice(0, 5); // Top 5

  // Calculate Max Pain (highest OI strike)
  const maxPain = puts.length > 0 ? puts[0].strike : spot;

  // Calculate delta vs spot for each strike
  const topStrikes = puts.map(p => ({
    ...p,
    deltaVsSpot: spot > 0 ? ((spot - p.strike) / spot * 100).toFixed(2) : '0'
  }));

  return { topStrikes, spot, maxPain };
}

// ========================== RENDER TABLE ==========================

function renderOpenInterestTable(topStrikes, spot) {
  const tbody = $('oiTableBody');
  tbody.innerHTML = '';

  if (!topStrikes || topStrikes.length === 0) {
    const row = tbody.insertRow();
    row.innerHTML = `<td colspan="4" style="text-align:center;color:var(--text-muted)">📊 Options chain no disponible</td>`;
    $('oiStatus').textContent = '⚠ Sin datos';
    return;
  }

  topStrikes.forEach(strike => {
    const row = tbody.insertRow();
    
    // Format OI
    const oiFormatted = strike.oi > 1000000 ? `${(strike.oi/1000000).toFixed(1)}M` : 
                        strike.oi > 1000 ? `${(strike.oi/1000).toFixed(0)}K` : 
                        strike.oi.toString();
    
    // Notes: Check if strike is below spot (support level)
    const notes = spot > strike.strike 
      ? '✅ Soporte institucional' 
      : '⚠ OTM (Fuera del dinero)';
    
    row.innerHTML = `
      <td class="mono"><strong>$${strike.strike.toFixed(2)}</strong></td>
      <td class="mono">${oiFormatted}</td>
      <td class="mono"><span class="up">${strike.deltaVsSpot}%</span></td>
      <td>${notes}</td>
    `;
  });

  $('oiStatus').textContent = `✅ ${topStrikes.length} strikes | Spot: $${spot.toFixed(2)}`;
}

// ========================== MAIN LOAD ==========================

async function loadOpenInterest() {
  const statusEl = $('dataStatus');
  statusEl.innerHTML = '<span class="dot"></span>Cargando OI desde Yahoo…';

  const underlying = UNDERLYINGS[state.selectedUnderlying];
  if (!underlying) {
    statusEl.innerHTML = '❌ Símbolo no válido';
    return;
  }

  const symbol = underlying.yahoo;
  console.log('Fetching data for symbol:', symbol);

  const optionData = await fetchYahooFinanceData(symbol);
  
  if (!optionData) {
    statusEl.innerHTML = '❌ Error al cargar datos';
    const tbody = $('oiTableBody');
    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;color:var(--danger)">❌ No se pudo conectar con Yahoo Finance</td></tr>`;
    return;
  }

  const { topStrikes, spot, maxPain } = processOpenInterestData(optionData);
  
  renderOpenInterestTable(topStrikes, spot);
  
  if (maxPain) {
    $('maxPain').textContent = `$${maxPain.toFixed(2)}`;
  }
  
  // GEX placeholder
  $('gexVal').textContent = '—';
  
  statusEl.innerHTML = '✅ Datos listos';
}

// ========================== EVENT LISTENERS ==========================

$('btnRefresh').addEventListener('click', () => {
  console.log('Refresh clicked');
  loadOpenInterest();
});

// ========================== INIT ==========================

document.addEventListener('DOMContentLoaded', () => {
  console.log('DOM loaded, fetching data...');
  loadOpenInterest();
});

</script>
</body>
</html>
