<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<meta name="description" content="Bull Put Credit Spread Pro - Análisis institucional, decisión SI/NO operar, gestión de riesgo y orden lista para broker.">
<title>Bull Put Credit Spread Pro · 1-7DTE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%88%3C/text%3E%3C/svg%3E">
<style>
/* ================= TOKENS ================= */
:root{
  --bg-primary:#0a0e1a;
  --bg-card:#131829;
  --bg-elevated:#1a2138;
  --bg-hover:#222a45;
  --border:#2a3252;
  --border-light:#3a4570;
  --text-primary:#e8ecf4;
  --text-secondary:#9aa3b8;
  --text-muted:#6b7390;
  --accent-gold:#d4a017;
  --accent-blue:#3b82f6;
  --accent-purple:#8b5cf6;
  --success:#10b981;
  --success-bg:rgba(16,185,129,.12);
  --warning:#f59e0b;
  --warning-bg:rgba(245,158,11,.12);
  --danger:#ef4444;
  --danger-bg:rgba(239,68,68,.12);
  --info:#06b6d4;
  --font-display:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',system-ui,sans-serif;
  --font-mono:'SF Mono','JetBrains Mono','Menlo','Consolas',monospace;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 4px 12px rgba(0,0,0,.3);
  --shadow-lg:0 12px 32px rgba(0,0,0,.4);
  --shadow-glow:0 0 24px rgba(212,160,23,.35);
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-xl:20px;
}

/* ================= BASE ================= */
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  background:var(--bg-primary);
  color:var(--text-primary);
  font-family:var(--font-display);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-primary);padding:8px 12px;border-radius:var(--r-sm);font-size:14px}
input:focus,select:focus{outline:none;border-color:var(--accent-gold)}
.mono{font-family:var(--font-mono)}
.muted{color:var(--text-muted)}
.small{font-size:12px}
.tiny{font-size:11px}
.up{color:var(--success)} .down{color:var(--danger)} .warn{color:var(--warning)}
hr{border:none;border-top:1px solid var(--border);margin:14px 0}

/* ================= HEADER ================= */
header{
  position:sticky;top:0;z-index:90;
  background:rgba(10,14,26,.95);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:10px 16px;
}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1900px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.logo .badge{background:linear-gradient(135deg,var(--accent-gold),#f5c842);color:#0a0e1a;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:800}
.status-pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:4px 9px;border-radius:99px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:5px;background:var(--bg-elevated);border:1px solid var(--border)}
.pill.live{color:var(--success)} .pill.cached{color:var(--warning)} .pill.manual{color:var(--danger)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.header-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--bg-elevated);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s}
.icon-btn:hover{background:var(--bg-hover);transform:translateY(-1px)}

/* ================= LAYOUT ================= */
.container{max-width:1900px;margin:0 auto;padding:14px 16px 80px}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:768px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1280px){.grid{grid-template-columns:300px 1fr 320px}}

.col{display:flex;flex-direction:column;gap:14px}

/* ================= CARDS ================= */
.card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  padding:14px;
  box-shadow:var(--shadow-sm);
  transition:border-color .2s;
}
.card:hover{border-color:var(--border-light)}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.card-h h3{font-size:13px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px}
.card-h .right{font-size:12px;color:var(--text-muted)}

/* ================= HERO ================= */
.hero{
  background:linear-gradient(135deg,#131829 0%,#1a2138 100%);
  border:2px solid var(--border);
  border-radius:var(--r-xl);
  padding:24px;
  margin-bottom:14px;
  position:relative;
  overflow:hidden;
}
.hero.go{border-color:var(--success);box-shadow:0 0 40px rgba(16,185,129,.25)}
.hero.go::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(16,185,129,.15),transparent 60%);pointer-events:none}
.hero.warn{border-color:var(--warning);box-shadow:0 0 40px rgba(245,158,11,.25)}
.hero.no{border-color:var(--danger);box-shadow:0 0 40px rgba(239,68,68,.2)}
.hero-row{display:flex;align-items:center;gap:20px;flex-wrap:wrap;position:relative}
.hero-icon{font-size:64px;line-height:1}
.hero-text{flex:1;min-width:200px}
.hero-decision{font-size:38px;font-weight:900;letter-spacing:.5px;line-height:1.1}
.hero.go .hero-decision{color:var(--success)}
.hero.warn .hero-decision{color:var(--warning)}
.hero.no .hero-decision{color:var(--danger)}
.hero-sub{color:var(--text-secondary);margin-top:6px;font-size:14px}
.hero-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-top:18px}
.hero-stat{background:rgba(0,0,0,.25);padding:10px 12px;border-radius:var(--r-md);border:1px solid var(--border)}
.hero-stat .lbl{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
.hero-stat .val{font-size:20px;font-weight:700;font-family:var(--font-mono);margin-top:2px}
.hero-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{padding:11px 18px;border-radius:var(--r-md);font-weight:700;font-size:13px;transition:all .2s;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:linear-gradient(135deg,var(--accent-gold),#f5c842);color:#0a0e1a}
.btn-primary:hover{transform:translateY(-1px);box-shadow:var(--shadow-glow)}
.btn-secondary{background:var(--bg-elevated);color:var(--text-primary);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--bg-hover)}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{color:var(--text-secondary);background:transparent;border:1px dashed var(--border)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ================= TABLE ================= */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
td.mono{font-family:var(--font-mono)}
.t-right{text-align:right}

/* ================= TOOLTIP ================= */
.tip{position:relative;display:inline-flex;align-items:center;gap:3px;cursor:help;border-bottom:1px dotted var(--text-muted)}

/* ================= STATS BOX ================= */
.stat-box{background:var(--bg-elevated);padding:8px;border-radius:var(--r-sm);text-align:center}
.stat-box .lbl{font-size:10px;color:var(--text-muted);text-transform:uppercase}
.stat-box .val{font-size:16px;font-weight:700;font-family:var(--font-mono);margin-top:2px}

/* ================= DISCLAIMER ================= */
.disclaimer{
  background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.3);
  border-radius:var(--r-md);padding:12px 14px;font-size:12px;
  color:var(--text-secondary);line-height:1.6;
}
.disclaimer b{color:var(--danger)}

/* ================= MOBILE OPT ================= */
@media(max-width:767px){
  .hero{padding:18px}
  .hero-decision{font-size:30px}
  .hero-icon{font-size:48px}
  .container{padding:10px 10px 80px}
  .card{padding:12px}
  .icon-btn{width:36px;height:36px}
}

/* Loading state */
.loading-row td{
  background:linear-gradient(90deg,var(--bg-elevated) 25%,var(--bg-hover) 50%,var(--bg-elevated) 75%);
  background-size:200px 100%;
  animation:shimmer 1.5s infinite;
  height:20px;
}

@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
</style>
</head>
<body>

<!-- ============================ HEADER ============================ -->
<header>
  <div class="header-inner">
    <div class="logo">
      📈 Bull Put Pro
      <span class="badge">v1.0</span>
    </div>
    <div class="status-pills" id="statusPills">
      <span class="pill cached" id="dataStatus"><span class="dot"></span>Cargando…</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btnRefresh" title="Refrescar datos">🔄</button>
    </div>
  </div>
</header>

<!-- ============================ MAIN ============================ -->
<div class="container">

  <!-- NIVELES INSTITUCIONALES -->
  <div class="card">
    <div class="card-h"><h3>🏛 Niveles institucionales</h3><div class="right small muted" id="oiStatus">—</div></div>
    <div class="small muted" style="margin-bottom:8px">Top 5 strikes PUT con mayor Open Interest (soportes institucionales). Si tu short put coincide con un muro = pinning te favorece.</div>
    <table id="oiTable">
      <thead><tr><th>Strike</th><th>OI</th><th>Δ vs spot</th><th>Notas</th></tr></thead>
      <tbody id="oiTableBody"></tbody>
    </table>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
      <div class="stat-box"><div class="lbl">Max Pain</div><div class="val mono" id="maxPain">—</div></div>
      <div class="stat-box"><div class="lbl">GEX (Mn $/pt)</div><div class="val mono" id="gexVal">—</div></div>
    </div>
  </div>

</div>

<!-- ============================ JS ============================ -->
<script>
// ========================== CONSTANTES ==========================

const UNDERLYINGS = {
  SPY:  { yahoo:'SPY',  minCapital:2000 },
  XSP:  { yahoo:'^XSP', minCapital:2000 },
  SPX:  { yahoo:'^SPX', minCapital:25000 },
  QQQ:  { yahoo:'QQQ',  minCapital:3000 },
  IWM:  { yahoo:'IWM',  minCapital:2000 },
  NVDA: { yahoo:'NVDA', minCapital:5000 },
  TSLA: { yahoo:'TSLA', minCapital:5000 }
};

// ========================== STATE ==========================

let state = {
  selectedUnderlying: 'XSP',
  marketData: {}
};

// ========================== UTILS ==========================

const $ = id => document.getElementById(id);
const fmt = (n, d=2) => isFinite(n) ? n.toLocaleString('en-US',{minimumFractionDigits:d, maximumFractionDigits:d}) : '—';

// ========================== FETCH YAHOO DATA ==========================

async function fetchYahooFinanceData(symbol) {
  try {
    const url = `https://query1.finance.yahoo.com/v10/finance/quoteSummary/${symbol}?modules=optionChain`;
    
    const response = await fetch(url);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    
    const data = await response.json();
    
    if (data.quoteSummary?.result?.[0]?.optionChain?.result?.[0]) {
      const optionData = data.quoteSummary.result[0].optionChain.result[0];
      return optionData;
    }
    
    throw new Error('No option chain data available');
  } catch (error) {
    console.error('Error fetching Yahoo Finance data:', error);
    return null;
  }
}

// ========================== PROCESS OI DATA ==========================

function processOpenInterestData(optionData) {
  if (!optionData?.puts) {
    return { topStrikes: [], spot: null, maxPain: null };
  }

  const spot = optionData.quote?.regularMarketPrice || 0;
  
  // Extract PUT options with OI
  const puts = optionData.puts
    .filter(p => p.openInterest && p.openInterest > 0)
    .map(p => ({
      strike: p.strike,
      oi: p.openInterest,
      delta: p.delta || 0,
      lastPrice: p.lastPrice || 0
    }))
    .sort((a, b) => b.oi - a.oi)
    .slice(0, 5); // Top 5

  // Calculate Max Pain (simplified: highest OI strike)
  const maxPain = puts.length > 0 ? puts[0].strike : spot;

  // Calculate delta vs spot for each strike
  const topStrikes = puts.map(p => ({
    ...p,
    deltaVsSpot: ((spot - p.strike) / spot * 100).toFixed(2)
  }));

  return { topStrikes, spot, maxPain };
}

// ========================== RENDER TABLE ==========================

function renderOpenInterestTable(topStrikes, spot) {
  const tbody = $('oiTableBody');
  tbody.innerHTML = '';

  if (!topStrikes || topStrikes.length === 0) {
    const row = tbody.insertRow();
    row.innerHTML = `<td colspan="4" style="text-align:center;color:var(--text-muted)">Options chain no disponible</td>`;
    $('oiStatus').textContent = '⚠ Sin datos';
    return;
  }

  topStrikes.forEach(strike => {
    const row = tbody.insertRow();
    const oiFormatted = strike.oi > 1000000 ? `${(strike.oi/1000000).toFixed(1)}M` : 
                        strike.oi > 1000 ? `${(strike.oi/1000).toFixed(0)}K` : 
                        strike.oi.toString();
    
    const notes = spot > strike.strike 
      ? '✅ Soporte institucional' 
      : '⚠ OTM';
    
    row.innerHTML = `
      <td class="mono"><strong>$${strike.strike.toFixed(2)}</strong></td>
      <td class="mono">${oiFormatted}</td>
      <td class="mono">${strike.deltaVsSpot}%</td>
      <td>${notes}</td>
    `;
  });

  $('oiStatus').textContent = `✅ ${topStrikes.length} strikes cargados`;
}

// ========================== MAIN LOAD ==========================

async function loadOpenInterest() {
  const statusEl = $('dataStatus');
  statusEl.innerHTML = '<span class="dot"></span>Cargando OI desde Yahoo…';

  const symbol = UNDERLYINGS[state.selectedUnderlying]?.yahoo;
  if (!symbol) {
    statusEl.textContent = '❌ Símbolo no válido';
    return;
  }

  const optionData = await fetchYahooFinanceData(symbol);
  
  if (!optionData) {
    statusEl.textContent = '❌ Error al cargar datos';
    $('oiTableBody').innerHTML = `<tr><td colspan="4" style="text-align:center;color:var(--text-danger)">Error al conectar con Yahoo Finance</td></tr>`;
    return;
  }

  const { topStrikes, spot, maxPain } = processOpenInterestData(optionData);
  
  renderOpenInterestTable(topStrikes, spot);
  
  if (maxPain) {
    $('maxPain').textContent = `$${maxPain.toFixed(2)}`;
  }
  
  // Placeholder GEX (normalmente requeriría API especializada)
  $('gexVal').textContent = '—';
  
  statusEl.textContent = '✅ Datos cargados';
}

// ========================== EVENT LISTENERS ==========================

$('btnRefresh').addEventListener('click', loadOpenInterest);

// ========================== INIT ==========================

document.addEventListener('DOMContentLoaded', loadOpenInterest);

</script>
</body>
</html>
